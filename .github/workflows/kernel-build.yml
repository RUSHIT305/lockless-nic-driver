name: kernel-build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly enterprise regression: Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  userspace-and-scripts:
    name: Userspace and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format gcc

      - name: Compile and run SPSC stress test
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/test_ring.c -o /tmp/lockless-ring-test
          /tmp/lockless-ring-test

      - name: Validate shell scripts
        run: |
          bash -n scripts/setup_netns.sh
          bash -n scripts/test_throughput.sh
          bash -n scripts/production_gate.sh
          bash -n scripts/sign_module.sh

      - name: Check C formatting
        run: clang-format --dry-run --Werror src/lockless_nic.h src/*.c

  kernel:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Linux 5.15 baseline
            image: ubuntu:22.04
            headers: linux-headers-generic
          - name: Linux 6.1 baseline
            image: debian:bookworm
            headers: linux-headers-amd64
          - name: Linux 6.8 baseline
            image: ubuntu:24.04
            headers: linux-headers-generic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential bc bison flex libelf-dev \
            libssl-dev pahole sparse clang-format kmod ${{ matrix.headers }}

      - name: Locate target kernel build tree
        shell: bash
        run: |
          KDIR="$(find /usr/src -mindepth 1 -maxdepth 1 -type d \
            \( -name '*-generic' -o -name '*-amd64' \) | sort | tail -n 1)"
          test -n "$KDIR"
          test -f "$KDIR/Makefile"
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "Using target kernel tree: $KDIR"

      - name: Build lockless NIC module
        shell: bash
        run: |
          make -C src KDIR="$KDIR" W=1 KBUILD_MODPOST_WARN=1

      - name: Run sparse static analysis
        shell: bash
        run: |
          make -C src check KDIR="$KDIR" W=1 KBUILD_MODPOST_WARN=1

      - name: Verify module metadata
        shell: bash
        run: |
          test -f src/lockless_nic.ko
          modinfo src/lockless_nic.ko | tee /tmp/lockless-nic-modinfo.txt
          grep -q '^license:.*GPL' /tmp/lockless-nic-modinfo.txt
          grep -q '^name:.*lockless_nic' /tmp/lockless-nic-modinfo.txt
