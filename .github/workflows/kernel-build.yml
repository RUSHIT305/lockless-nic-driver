name: kernel-build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly enterprise regression: Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  userspace-and-scripts:
    name: Userspace and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format gcc

      - name: Compile and run SPSC stress test
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/test_ring.c -o /tmp/lockless-ring-test
          /tmp/lockless-ring-test

      - name: Validate shell scripts
        run: |
          bash -n scripts/setup_netns.sh
          bash -n scripts/test_throughput.sh
          bash -n scripts/production_gate.sh

      - name: Check C formatting
        run: clang-format --dry-run --Werror src/lockless_nic.h src/*.c

  kernel:
    name: Linux ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - series: 5.x
            version: 5.15.180
          - series: 6.x
            version: 6.1.112
          - series: 6.x
            version: 6.6.52
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev \
            libssl-dev cpio pahole xz-utils sparse

      - name: Download Linux ${{ matrix.version }}
        run: |
          archive="/tmp/linux-${{ matrix.version }}.tar.xz"
          url="https://cdn.kernel.org/pub/linux/kernel/v${{ matrix.series }}/linux-${{ matrix.version }}.tar.xz"
          for attempt in {1..12}; do
            if curl --fail --location --http1.1 --continue-at - \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 1800 \
              "$url" --output "$archive"; then
              break
            fi
            if tar -tJf "$archive" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "kernel source download failed after $attempt attempts" >&2
              exit 1
            fi
            echo "partial download; resuming in 10 seconds (attempt $attempt/12)"
            sleep 10
          done
          tar -tJf "$archive" >/dev/null
          tar -C /tmp -xf "$archive"

      - name: Prepare kernel build tree
        run: |
          make -C "/tmp/linux-${{ matrix.version }}" defconfig
          make -C "/tmp/linux-${{ matrix.version }}" modules_prepare

      - name: Build lockless NIC module
        run: |
          make -C src KDIR="/tmp/linux-${{ matrix.version }}" W=1 KBUILD_MODPOST_WARN=1

      - name: Run sparse static analysis
        run: |
          make -C src check KDIR="/tmp/linux-${{ matrix.version }}" W=1 KBUILD_MODPOST_WARN=1
